name: Release

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-vsix
  cancel-in-progress: false

jobs:
  release:
    name: Version, package, and release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply changesets
        id: version
        shell: bash
        run: |
          set -euo pipefail
          previous_version="$(node -p 'require("./package.json").version')"
          npm run changeset:version
          version="$(node -p 'require("./package.json").version')"
          npm version "${version}" --no-git-tag-version --allow-same-version
          lock_version="$(node -p 'require("./package-lock.json").version')"
          root_lock_version="$(node -p 'require("./package-lock.json").packages[""].version')"
          if test "${version}" = "${previous_version}"; then
            echo "No pending changesets produced a release." >&2
            exit 1
          fi
          test "${version}" = "${lock_version}"
          test "${version}" = "${root_lock_version}"
          test -z "$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)"
          test -s CHANGELOG.md
          printf 'version=%s\ntag=v%s\n' "${version}" "${version}" >> "${GITHUB_OUTPUT}"

      - name: Check that the release tag is new
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          matches="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${TAG}" --jq 'length')"
          if test "${matches}" != "0"; then
            echo "Tag ${TAG} already exists." >&2
            exit 1
          fi

      - name: Build and package the VSIX
        run: npm run package

      - name: Verify the VSIX
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VSIX_PATH: pi-coding-agent-vscode.vsix
        shell: bash
        run: |
          set -euo pipefail
          test -s "${VSIX_PATH}"
          unzip -t "${VSIX_PATH}"
          archive_version="$(unzip -p "${VSIX_PATH}" extension/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')"
          test "${archive_version}" = "${VERSION}"

      - name: Commit the release changes
        id: commit
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { readFileSync, writeFileSync } = require("node:fs");

          const changes = execFileSync("git", ["diff", "--name-status", "--no-renames", "HEAD"], { encoding: "utf8" })
            .trim()
            .split("\n")
            .filter(Boolean)
            .map(line => {
              const separator = line.indexOf("\t");
              return { status: line.slice(0, separator), path: line.slice(separator + 1) };
            });
          const releaseFiles = new Set(["CHANGELOG.md", "package-lock.json", "package.json"]);
          const additions = changes.filter(change => releaseFiles.has(change.path) && change.status !== "D");
          const deletions = changes.filter(change => change.status === "D" && /^\.changeset\/.+\.md$/.test(change.path) && change.path !== ".changeset/README.md");
          const recognized = new Set([...additions, ...deletions].map(change => `${change.status}\0${change.path}`));
          const unexpected = changes.filter(change => !recognized.has(`${change.status}\0${change.path}`));
          if (unexpected.length !== 0) throw new Error(`Unexpected release changes: ${unexpected.map(change => `${change.status} ${change.path}`).join(", ")}`);
          for (const path of releaseFiles) {
            if (!additions.some(change => change.path === path)) throw new Error(`Missing release update: ${path}`);
          }
          if (deletions.length === 0) throw new Error("No consumed changesets were found.");

          const encode = path => readFileSync(path).toString("base64");
          const input = {
            branch: {
              repositoryNameWithOwner: process.env.GITHUB_REPOSITORY,
              branchName: "main",
            },
            expectedHeadOid: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
            message: {
              headline: `chore(release): v${process.env.VERSION}`,
            },
            fileChanges: {
              additions: additions.map(({ path }) => ({ path, contents: encode(path) })),
              deletions: deletions.map(({ path }) => ({ path })),
            },
          };
          const query = `mutation CreateReleaseCommit($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }`;
          writeFileSync(process.env.RUNNER_TEMP + "/release-commit.json", JSON.stringify({ query, variables: { input } }));
          NODE

          gh api graphql --input "${RUNNER_TEMP}/release-commit.json" > "${RUNNER_TEMP}/release-commit-response.json"
          commit_sha="$(node -p 'require(process.env.RUNNER_TEMP + "/release-commit-response.json").data.createCommitOnBranch.commit.oid')"
          test -n "${commit_sha}"
          printf 'sha=%s\n' "${commit_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
          VSIX_PATH: pi-coding-agent-vscode.vsix
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" "${VSIX_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_SHA}" \
            --title "Pi v${VERSION}" \
            --generate-notes
