name: Publish to Marketplace

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the extension
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify the release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if test "${RELEASE_TAG}" != "v${version}"; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${version}." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test, build, and package the extension
        run: npm run package

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if test -z "${VSCE_PAT}"; then
            echo "The VSCE_PAT repository secret is required." >&2
            exit 1
          fi
          npx --no-install vsce publish --packagePath pi.vsix
