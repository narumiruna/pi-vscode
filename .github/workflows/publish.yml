name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-vsix
  cancel-in-progress: false
  queue: max

jobs:
  version:
    name: Create version PR or detect release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out the merged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect the version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if ! git cat-file -e "${BEFORE_SHA}:package.json" 2>/dev/null; then
            echo "No previous package.json is available; checking for a version PR without publishing."
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          previous_version="$(git show "${BEFORE_SHA}:package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')"
          if test "${version}" = "${previous_version}"; then
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${version}" = "$(node -p 'require("./package-lock.json").version')"
          test "${version}" = "$(node -p 'require("./package-lock.json").packages[""].version')"
          test -z "$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)"
          test -s CHANGELOG.md
          if git show-ref --verify --quiet "refs/tags/v${version}"; then
            echo "Tag v${version} already exists." >&2
            exit 1
          fi
          printf 'release=true\nversion=%s\ntag=v%s\n' "${version}" "${version}" >> "${GITHUB_OUTPUT}"

      - name: Create or update the version PR
        if: steps.version.outputs.release != 'true'
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

  release:
    name: Package and release
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ github.sha }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package the VSIX
        run: npm run package

      - name: Verify the VSIX
        env:
          VERSION: ${{ needs.version.outputs.version }}
          VSIX_PATH: pi.vsix
        shell: bash
        run: |
          set -euo pipefail
          test -s "${VSIX_PATH}"
          unzip -t "${VSIX_PATH}"
          archive_version="$(unzip -p "${VSIX_PATH}" extension/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')"
          test "${archive_version}" = "${VERSION}"

      - name: Upload the verified VSIX
        uses: actions/upload-artifact@v4
        with:
          name: release-vsix
          path: pi.vsix
          if-no-files-found: error

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          VSIX_PATH: pi.vsix
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" "${VSIX_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_SHA}" \
            --title "Pi v${VERSION}" \
            --generate-notes

  publish:
    name: Publish the extension
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the verified VSIX
        uses: actions/download-artifact@v4
        with:
          name: release-vsix

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if test -z "${VSCE_PAT}"; then
            echo "The VSCE_PAT repository secret is required." >&2
            exit 1
          fi
          npx --no-install vsce publish --packagePath pi.vsix
